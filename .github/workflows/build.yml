name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # The Ndless SDK package is built on Debian 13 and needs its glibc.
    container: debian:13
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq make git

      - uses: actions/checkout@v7

      - name: Install the Ndless SDK (nightly package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/ndless-nspire/Ndless/releases/tags/nightly \
            | jq -r '[.assets[] | select(.name | endswith("_amd64.deb")) | .browser_download_url][0] // empty')
          if [ -z "$url" ]; then
            echo "No amd64 .deb in the Ndless nightly release" >&2
            exit 1
          fi
          echo "Using $url"
          curl -fsSL -o /tmp/ndless-sdk.deb "$url"
          apt-get install -y /tmp/ndless-sdk.deb

      - name: Build
        run: make

      - uses: actions/upload-artifact@v7
        with:
          name: cx-led
          path: |
            cxled.tns
            presets/*.led.tns
            README.md
            LICENSE
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cx-led
          path: cx-led

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r cx-led.zip cx-led
          gh release create "$GITHUB_REF_NAME" cx-led.zip cx-led/cxled.tns \
            --repo "$GITHUB_REPOSITORY" --title "cx-led $GITHUB_REF_NAME" --generate-notes
